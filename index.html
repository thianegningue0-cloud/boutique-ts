<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Boutique TS</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header>
    <h1>Mini Boutique</h1>
    <input id="search" type="text" placeholder="Rechercher un produit..." />
    <select id="category">
      <option value="">Toutes catégories</option>
      <option value="tech">Tech</option>
      <option value="maison">Maison</option>
      <option value="mode">Mode</option>
    </select>
    <div id="cart-count">Panier: 0 - 0FCFA</div>
  </header>

  <main>
    <section id="catalogue"></section>
    <aside id="panier">
      <h2>Panier</h2>
      <div id="panier-items"></div>
      <p id="panier-total">Total: 0FCFA</p>
    </aside>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
